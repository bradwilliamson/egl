name: CI - SDL2 Build & Smoke Test

on:
  push:
    branches: [ main, sdl2-integration ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-sdl2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev libxrandr-dev libx11-dev libxi-dev libgl1-mesa-dev pkg-config

      - name: Build project (SDL2)
        run: |
          set -o pipefail
          echo "Workspace: $(pwd)"
          ls -la || true
          echo "gcc --version:"; gcc --version || true
          echo "pkg-config sdl2 --modversion:"; pkg-config --modversion sdl2 || true
          if [ -f Makefile.unix ]; then
            echo "Using Makefile.unix"
            make -f Makefile.unix USE_SDL2=1 2>&1 | tee build.log
          elif [ -f Makefile ]; then
            echo "Using Makefile"
            make USE_SDL2=1 2>&1 | tee build.log
          elif [ -f unix/Makefile ]; then
            echo "Using unix/Makefile"
            make -C unix USE_SDL2=1 2>&1 | tee build.log
          else
            echo "ERROR: no Makefile found" 2>&1 | tee build.log
            exit 2
          fi

      - name: Show build log (tail)
        if: always()
        run: |
          echo "---- build.log tail (last 300 lines) ----"
          if [ -f build.log ]; then
            tail -n 300 build.log || true
          else
            echo "No build.log present; listing workspace:"
            ls -la || true
          fi
          echo "---- end build.log tail ----"

      - name: Compile SDL2 smoke test
        if: success()
        run: |
          echo "Compiling smoke test"
          gcc -o ci/sdl2_smoke ci/sdl2_smoke.c `pkg-config --cflags --libs sdl2` 2>&1 | tee ci/compile_smoke.log || (gcc -o ci/sdl2_smoke ci/sdl2_smoke.c -lSDL2 2>&1 | tee -a ci/compile_smoke.log)

      - name: Run SDL2 smoke test (dummy audio)
        if: success()
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          echo "Using SDL_AUDIODRIVER=$SDL_AUDIODRIVER"
          ./ci/sdl2_smoke || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdl2-ci-logs
          path: |
            ci/sdl2_smoke
            build.log
