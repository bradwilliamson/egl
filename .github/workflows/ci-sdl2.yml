name: CI - SDL2 Build & Smoke Test

on:
  push:
    branches: [ master, main, sdl2-integration, modernization-v1 ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: {}

jobs:
  build-sdl2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev libxrandr-dev libx11-dev libxi-dev libgl1-mesa-dev pkg-config libjpeg-dev libpng-dev libminizip-dev libvulkan-dev

      - name: Build project (SDL2)
        run: |
          set -o pipefail
          echo "Workspace: $(pwd)"
          ls -la || true
          echo "gcc --version:"; gcc --version || true
          echo "pkg-config sdl2 --modversion:"; pkg-config --modversion sdl2 || true
          if [ -f Makefile.unix ]; then
            echo "Using Makefile.unix"
            make -f Makefile.unix USE_SDL2=1 2>&1 | tee build.log
          elif [ -f Makefile ]; then
            echo "Using Makefile"
            make USE_SDL2=1 2>&1 | tee build.log
          elif [ -f unix/Makefile ]; then
            echo "Using unix/Makefile"
            make -C unix USE_SDL2=1 2>&1 | tee build.log
          else
            echo "ERROR: no Makefile found" 2>&1 | tee build.log
            exit 2
          fi

      - name: Build and run unit tests
        run: |
          set -o pipefail
          make -C tests ci 2>&1 | tee tests/test-output.log

      - name: Show build log (tail)
        if: always()
        run: |
          echo "---- build.log errors (first 200 matches) ----"
          if [ -f build.log ]; then
            # Match actual compiler-style errors, not symbols like Com_Error
            grep -n -E -i "(^|: )[[:space:]]*(fatal error:|error:)" build.log | sed -n '1,200p' || true
            echo "---- build.log warnings (first 200 matches) ----"
            grep -n -i "warning" build.log | sed -n '1,200p' || true
            echo "---- build.log tail (last 300 lines) ----"
            tail -n 300 build.log || true
          else
            echo "No build.log present; listing workspace:"
            ls -la || true
          fi
          echo "---- end build.log ----"

      - name: Compile SDL2 smoke test
        if: success()
        run: |
          echo "Compiling smoke test"
          set -o pipefail
          gcc -o ci/sdl2_smoke ci/sdl2_smoke.c `pkg-config --cflags --libs sdl2` 2>&1 | tee ci/compile_smoke.log || (set -o pipefail; gcc -o ci/sdl2_smoke ci/sdl2_smoke.c -lSDL2 2>&1 | tee -a ci/compile_smoke.log)

      - name: Compile Vulkan smoke test
        if: success()
        run: |
          echo "Compiling Vulkan smoke test"
          set -o pipefail
          gcc -o ci/vulkan_smoke ci/vulkan_smoke.c `pkg-config --cflags --libs sdl2` -lvulkan 2>&1 | tee ci/compile_vulkan_smoke.log

      - name: Run SDL2 smoke test (dummy audio)
        if: success()
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          echo "Using SDL_AUDIODRIVER=$SDL_AUDIODRIVER"
          ./ci/sdl2_smoke || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdl2-ci-logs
          if-no-files-found: warn
          path: |
            ci/sdl2_smoke
            build.log
            ci/compile_smoke.log
            ci/vulkan_smoke
            ci/compile_vulkan_smoke.log
            tests/*.log
            tests/test-output.log

  build-sdl2-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        msystem: [MINGW64]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-minizip

      - name: Ensure SDL2 runtime is present (Windows)
        run: |
          set -e
          pacman -S --noconfirm --needed mingw-w64-x86_64-SDL2
          if [ ! -f /mingw64/bin/SDL2.dll ]; then
            echo "ERROR: /mingw64/bin/SDL2.dll is missing"
            pacman -Qi mingw-w64-x86_64-SDL2 || true
            ls -la /mingw64/bin | sed -n '1,200p' || true
            exit 2
          fi
          ls -la /mingw64/bin/SDL2.dll

      - name: Build project (Windows, SDL2)
        run: |
          set -o pipefail
          echo "MSYSTEM=$MSYSTEM"
          echo "MSYSTEM_PREFIX=$MSYSTEM_PREFIX"
          export EGL_MSYS2_ROOT=""
          export EGL_MSYS2_PREFIX="$MSYSTEM_PREFIX"
          echo "Using SDL2 from: $MSYSTEM_PREFIX/bin/SDL2.dll"
          ls -la "$MSYSTEM_PREFIX/bin/SDL2.dll"
          echo "gcc --version:"; gcc --version || true
          echo "make --version:"; make --version || true
          make clean
          make USE_SDL2=1 2>&1 | tee build-win.log
          make dedicated USE_SDL2=1 2>&1 | tee -a build-win.log

      - name: Build and run unit tests (Windows)
        run: |
          set -o pipefail
          make -C tests ci 2>&1 | tee tests/test-output.log

      - name: Compile Vulkan smoke test (Windows)
        run: |
          set -o pipefail
          echo "Compiling Vulkan smoke test (object only)"
          gcc -c -o ci/vulkan_smoke.o ci/vulkan_smoke.c `pkg-config --cflags sdl2` 2>&1 | tee compile-vulkan-smoke-win.log

      - name: Upload Windows build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdl2-windows-ci-logs-${{ matrix.msystem }}
          if-no-files-found: warn
          path: |
            build-win.log
            compile-vulkan-smoke-win.log
            ci/vulkan_smoke.o
            tests/*.log
            tests/test-output.log
